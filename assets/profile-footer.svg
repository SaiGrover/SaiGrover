<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">Building practical AI solutions</title>
  <desc id="desc">Animated blue and violet footer with a data-wave motif.</desc>

  <defs>
    <linearGradient id="footerBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#07111f" />
      <stop offset="48%" stop-color="#102a56" />
      <stop offset="100%" stop-color="#30145f" />
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="190" rx="22" fill="url(#footerBg)" />

  <path d="M0 39 C140 3 235 74 370 39 S620 4 755 39 980 77 1200 34" fill="none" stroke="url(#wave)" stroke-width="2.5" opacity="0.78">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M0 39 C140 3 235 74 370 39 S620 4 755 39 980 77 1200 34;
              M0 34 C150 76 250 5 390 40 S630 75 770 36 1010 4 1200 42;
              M0 39 C140 3 235 74 370 39 S620 4 755 39 980 77 1200 34" />
  </path>
  <path d="M0 61 C145 95 245 24 385 60 S625 95 765 57 1000 25 1200 64" fill="none" stroke="url(#wave)" stroke-width="1.4" opacity="0.35">
    <animate attributeName="d" dur="9s" repeatCount="indefinite"
      values="M0 61 C145 95 245 24 385 60 S625 95 765 57 1000 25 1200 64;
              M0 65 C140 28 250 96 395 58 S640 25 780 64 1015 94 1200 55;
              M0 61 C145 95 245 24 385 60 S625 95 765 57 1000 25 1200 64" />
  </path>

  <g filter="url(#glow)">
    <circle r="4.5" fill="#22d3ee">
      <animateMotion dur="6s" repeatCount="indefinite" path="M80 50 C250 0 360 90 535 44 S850 5 1120 46" />
    </circle>
    <circle r="4.5" fill="#c084fc">
      <animateMotion dur="7.5s" begin="-2s" repeatCount="indefinite" path="M1120 58 C900 100 760 10 590 58 S260 100 80 55" />
    </circle>
  </g>

  <g text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="600" y="112" fill="#ffffff" font-size="25" font-weight="700">Building practical AI solutions</text>
    <text x="600" y="145" fill="#bfdbfe" font-size="17" letter-spacing="0.7">that transform data into meaningful impact.</text>
    <text x="600" y="174" fill="#93c5fd" font-size="12" letter-spacing="3">LEARN · BUILD · EXPLAIN · IMPACT</text>
  </g>
</svg>
